[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffd"
version = "0.1.0"
description = "Deepfake detector: CLIP ViT-L/14-336 + LoRA (CompFFD)"
requires-python = ">=3.10"
dependencies = [
  "torch", "transformers", "peft", "numpy", "scipy", "pandas", "pyarrow",
  "scikit-learn", "opencv-python-headless", "pyyaml", "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["ffd", "ffd.data", "ffd.heads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: cần model thật/GPU; chỉ chạy với --run-gpu"]
