# Ví dụ config cho ffd.config.load_train_config (không prereg). Trạng thái: chưa chạy thử trên GPU.
data_root: F:/DeepFakeData/duy_output/compsynth_ff   # = out_root của preprocessing
ckpt_root: checkpoints/clip   # nơi lưu checkpoint/kết quả; run nằm ở ckpt_root/<run_name>
arm: raw              # raw | raw_aug (+ mọi rep/seam) | raw_rep (raw_aug bỏ seam); main tự đặt từng arm
run_name: null        # null -> dùng tên arm
seed: 0
model_name: openai/clip-vit-large-patch14
model_revision: null  # commit HF để ghim phiên bản; null = mới nhất
lora_r: 16
lora_alpha: 16
lora_dropout: 0.0
lora_targets: [q_proj, v_proj]
tap_layers: []
head: binary
grad_checkpointing: false   # tắt: nhanh hơn ~21%, VRAM ~8.8 GB (smoke 16/11); không vào hash
batch_size: 32
lr: 1.0e-4            # theo run thử lr1e-4_p0.5: AUC frame val 0.9954 sau 3 epoch (16/11)
weight_decay: 0.01
warmup_frac: 0.05
max_epochs: 30
patience: 5           # early stopping: AUC frame val không tăng quá 1e-4 trong 5 epoch liên tiếp
p_jpeg: 0.5           # xác suất nén JPEG lúc train
jpeg_q: 95            # chất lượng JPEG
num_workers: 4        # worker đọc ảnh (không vào hash)
