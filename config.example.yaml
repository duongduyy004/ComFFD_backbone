# Ví dụ config cho ffd.config.load_train_config. Trạng thái: chưa chạy thử.
ffpp_root: F:/DeepFakeData/compsynth_ff   # = out_root của preprocessing (chứa ffpp_raw/, ffpp_aug/)
runs_root: runs
mode: raw            # raw | raw+rep
seed: 0
rho: 0.5
# total_steps / eval_every / ckpt_every: GIÁ TRỊ GIỮ CHỖ, sẽ chốt trong pilot.
total_steps: 100
eval_every: 20
ckpt_every: 50
model_name: openai/clip-vit-large-patch14-336
lora_r: 16
lora_alpha: 16
lora_dropout: 0.0
lora_targets: [q_proj, v_proj]
tap_layers: []
head: binary
batch_size: 32
lr: 2.0e-4
weight_decay: 0.01
warmup_frac: 0.05
grad_accum: 1
num_workers: 4
jpeg_q: [75, 95]     # JPEG lúc train cho ảnh ffpp_raw; giữ trùng jpeg_q của preprocessing
selfblend: {hue: 5.0, sat: 0.10, val: 0.10, brightness: 10.0, contrast: 0.10, scale: 0.05, shift: 2.0}
prereg: null
