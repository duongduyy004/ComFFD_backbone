# VÍ DỤ với giá trị GIỮ CHỖ (MINH HỌA). File thật `configs/prereg_aug.yaml` chỉ được viết SAU pilot arm `raw`
# (1 seed, chỉ dùng FF++ val), rồi KHÔNG bao giờ sửa nữa. Sửa file sau khi chạy 9 run làm hash lệch -> eval từ chối.
# Chỉ được chứa khóa PREREG_KEYS và lora_* (khóa lạ -> ValueError).
# Trạng thái: chưa chạy thử.
rho: 0.5
lr: 2.0e-4
weight_decay: 0.01
warmup_frac: 0.05
total_steps: 100      # giữ chỗ: chốt từ pilot
eval_every: 20        # giữ chỗ: chốt từ pilot
batch_size: 32       # phải chẵn: mỗi batch nửa real, nửa fake
grad_accum: 1
model_name: openai/clip-vit-large-patch14-336
model_revision: null # BẮT BUỘC điền commit HF (ffd.cli smoke in ra); null -> `ffd.cli train` (không --pilot) từ chối
head: binary
tap_layers: []
grad_checkpointing: true
lora_r: 16
lora_alpha: 16
lora_dropout: 0.0
lora_targets: [q_proj, v_proj]
selfblend: {hue: 5.0, sat: 0.10, val: 0.10, brightness: 10.0, contrast: 0.10, scale: 0.05, shift: 2.0}
